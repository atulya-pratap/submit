<form id="profile-form">
            
            <div class="form-group">
                <label for="student-name">Select Your Name *</label>
                <select id="student-name" required>
                    <option value="">-- Choose your name --</option>
                    <!-- PASTE YOUR 66 NAMES HERE -->
                </select>
                <small>If your name isn't here, contact Atulya.</small>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="number" id="roll_number" placeholder="e.g. 17">
                </div>
                <div class="form-group">
                    <label for="house">House</label>
                    <select id="house">
                        <option value="">-- Select your House --</option>
                        <option value="Aravali">Aravali</option>
                        <option value="Nilgiri">Nilgiri</option>
                        <option value="Shivalik">Shivalik</option>
                        <option value="Udaygiri">Udaygiri</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="bio">Short Bio</label>
                <textarea id="bio" rows="3" placeholder="I've always been fascinated by..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="hobbies">Hobbies (Comma separated)</label>
                    <input type="text" id="hobbies" placeholder="Photography, Coding, Cricket">
                </div>
                <div class="form-group">
                    <label for="interest">Interests (Comma separated)</label>
                    <input type="text" id="interest" placeholder="Technology, Cinema, Space">
                </div>
            </div>

            <div class="form-group">
                <label for="favourite_subject">Favourite Subject</label>
                <input type="text" id="favourite_subject" placeholder="Mathematics">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="favourite_book">Favourite Book</label>
                    <input type="text" id="favourite_book" placeholder="e.g. Atomic Habits">
                </div>
                <div class="form-group">
                    <label for="favourite_movie">Favourite Movie</label>
                    <input type="text" id="favourite_movie" placeholder="e.g. Interstellar">
                </div>
            </div>

            <div class="form-group">
                <label for="achievements">Achievements & Creative Work</label>
                <textarea id="achievements" rows="3" placeholder="Tell us about your awards, school memories, or creative projects..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="instagram">Instagram Handle</label>
                    <input type="text" id="instagram" placeholder="username (no @)">
                </div>
                <div class="form-group">
                    <label for="favourite_quote">Signature Quote</label>
                    <input type="text" id="favourite_quote" placeholder="Keep it under 15 words...">
                </div>
            </div>

            <div class="form-group">
                <label for="photo_url">Profile Photo URL (Optional)</label>
                <input type="url" id="photo_url" placeholder="Paste a public link to your photo (Drive, Instagram, Imgur)">
            </div>

            <button type="submit" id="submit-btn">Submit Profile to Database</button>
            <p id="status-message"></p>

        </form>
