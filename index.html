<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Profile | JNV Varanasi Magazine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <!-- This line is what makes it look beautiful! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="submit-header">
        <h1>JNV Varanasi</h1>
        <p>Issue No. 1 • Profile Submission Portal</p>
    </header>

    <main class="form-container">
        <form id="profile-form">
            
            <!-- SECTION 1: MAIN PROFILE -->
            <div class="section-divider">
                <h2>Main Profile</h2>
                <p>The core details for your magazine card</p>
            </div>

            <div class="form-group">
                <label for="student-name">Select Your Name *</label>
                <select id="student-name" required>
                    <option value="">-- Choose your name --</option>
                    <!-- PASTE YOUR 66 NAMES HERE -->
                </select>
                <small>If your name isn't here, contact Atulya.</small>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="number" id="roll_number" placeholder="e.g. 17">
                </div>
                <div class="form-group">
                    <label for="house">House</label>
                    <select id="house">
                        <option value="">-- Select your House --</option>
                        <option value="Aravali">Aravali</option>
                        <option value="Nilgiri">Nilgiri</option>
                        <option value="Shivalik">Shivalik</option>
                        <option value="Udaygiri">Udaygiri</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="bio">Short Bio</label>
                <textarea id="bio" rows="3" placeholder="I've always been fascinated by..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="hobbies">Hobbies (Comma separated)</label>
                    <input type="text" id="hobbies" placeholder="Photography, Coding, Cricket">
                </div>
                <div class="form-group">
                    <label for="interest">Interests (Comma separated)</label>
                    <input type="text" id="interest" placeholder="Technology, Cinema, Space">
                </div>
            </div>

            <div class="form-group">
                <label for="favourite_subject">Favourite Subject</label>
                <input type="text" id="favourite_subject" placeholder="Mathematics">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="favourite_book">Favourite Book</label>
                    <input type="text" id="favourite_book" placeholder="e.g. Atomic Habits">
                </div>
                <div class="form-group">
                    <label for="favourite_movie">Favourite Movie</label>
                    <input type="text" id="favourite_movie" placeholder="e.g. Interstellar">
                </div>
            </div>

            <div class="form-group">
                <label for="achievements">Achievements & Creative Work</label>
                <textarea id="achievements" rows="3" placeholder="Tell us about your awards, school memories, or creative projects..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="instagram">Instagram Handle</label>
                    <input type="text" id="instagram" placeholder="username (no @)">
                </div>
                <div class="form-group">
                    <label for="favourite_quote">Signature Quote</label>
                    <input type="text" id="favourite_quote" placeholder="Keep it under 15 words...">
                </div>
            </div>

            <div class="form-group">
                <label for="photo_url">Profile Photo URL (Optional)</label>
                <input type="url" id="photo_url" placeholder="Paste a public link to your photo (Drive, Instagram, Imgur)">
            </div>


            <!-- SECTION 2: JNV MEMORIES -->
            <div class="section-divider">
                <h2>Navodaya Memories (Optional)</h2>
                <p>Fill out as many as you'd like. This is the heart of the magazine!</p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="favourite_song">Favourite / Comfort Song</label>
                    <input type="text" id="favourite_song" placeholder="e.g. Night Changes">
                </div>
                <div class="form-group">
                    <label for="hidden_talent">Hidden Talent</label>
                    <input type="text" id="hidden_talent" placeholder="e.g. I can sleep with my eyes open">
                </div>
            </div>

            <div class="form-group">
                <label for="navodaya_means">What does Navodaya mean to you?</label>
                <textarea id="navodaya_means" rows="2" placeholder="To me, Navodaya is..."></textarea>
            </div>

            <div class="form-group">
                <label for="favourite_jnv_memory">📸 Your Favourite Navodaya Memory</label>
                <textarea id="favourite_jnv_memory" rows="3" placeholder="Late night Maggi, hostel talks, that one sports meet..."></textarea>
            </div>

            <div class="form-group">
                <label for="what_i_will_miss">What I will miss the most</label>
                <textarea id="what_i_will_miss" rows="2" placeholder="The morning PT, friends, the mess food (maybe)..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="how_jnv_changed_me">How JNV Changed Me</label>
                <textarea id="how_jnv_changed_me" rows="2" placeholder="It taught me how to be independent..."></textarea>
            </div>

            <div class="form-group">
                <label for="future_goal">Future Goal</label>
                <input type="text" id="future_goal" placeholder="e.g. Software Engineer, Doctor, NDA...">
            </div>

            <!-- Teacher Group -->
            <div class="form-grid">
                <div class="form-group">
                    <label for="favourite_teacher">Favourite Teacher</label>
                    <input type="text" id="favourite_teacher" placeholder="Name of the teacher">
                </div>
                <div class="form-group">
                    <label for="favourite_teacher_reason">Why?</label>
                    <input type="text" id="favourite_teacher_reason" placeholder="Because they always... ">
                </div>
            </div>

            <!-- Anything Else Group -->
            <div class="form-grid">
                <div class="form-group">
                    <label for="anything_else">Anything Else (Heading)</label>
                    <input type="text" id="anything_else" placeholder="e.g. My Secret Nickname, A Confession...">
                </div>
                <div class="form-group">
                    <label for="anything_else_brief">Explain Briefly</label>
                    <input type="text" id="anything_else_brief" placeholder="Tell us about it...">
                </div>
            </div>

            <button type="submit" id="submit-btn">Submit Profile to Database</button>
            <p id="status-message"></p>

        </form>
    </main>

    <!-- This line connects your submit button to Supabase! -->
    <script src="script.js"></script>
</body>
</html>
